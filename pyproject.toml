[project]
name = "wifi-login"
version = "0.1.0"
description = "macOS 自动登录 WiFi Portal 的脚本"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ddddocr>=1.5.0",
    "pillow>=10.0.0",
    "pyobjc-framework-CoreWLAN>=10.0",
    "requests>=2.31.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
